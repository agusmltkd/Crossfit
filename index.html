<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cargas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cargas</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2b303b;
  --txt:#eef0f4;--mut:#8b93a3;--acc:#ff5a1f;--acc2:#ffb020;--ok:#33c47f;--bad:#ff4d5e;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px;letter-spacing:.5px}
header h1 span{color:var(--acc)}
main{padding:0 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:13px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:8px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip.dim{opacity:.45}
.big{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pct{font-size:44px;font-weight:800;min-width:110px;text-align:center}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:24px}
.result{text-align:center;margin-top:8px}
.result .kg{font-size:56px;font-weight:800;color:var(--acc2);line-height:1}
.result .kg small{font-size:20px;color:var(--mut);font-weight:600}
.qp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.qp button{padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px}
.qp button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.bar{display:flex;align-items:center;justify-content:center;gap:2px;height:84px;margin:14px 0 4px}
.sleeve{width:60px;height:10px;background:#5b6170;border-radius:2px}
.plate{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg)}
.platelist{text-align:center;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
tr.hl td{color:var(--acc2);font-weight:700}
td.r,th.r{text-align:right}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:700;margin-top:10px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:0}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.lift{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lift:last-child{border-bottom:0}
.lift .n{flex:1}
.lift .n b{display:block}
.lift input{width:96px;text-align:right}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.log{padding:10px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log .t{display:flex;justify-content:space-between;gap:8px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(51,196,127,.15);color:var(--ok);border:1px solid rgba(51,196,127,.35);margin-top:6px}
.day{font-size:13px;color:var(--acc);font-weight:700;margin:14px 0 2px;text-transform:capitalize}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px}
nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--acc)}
.hide{display:none!important}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:10px;font-size:14px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
</style>
</head>
<body>
<header><h1>Car<span>gas</span></h1><span class="mut" id="hdrLift"></span></header>
<main>

<!-- CALCULAR -->
<section id="v-calc">
  <div class="card">
    <h2>Ejercicio</h2>
    <div class="chips" id="calcLifts"></div>
  </div>
  <div class="card" id="calcBox">
    <div class="big">
      <button class="round" data-d="-5">−</button>
      <div class="pct"><span id="pctVal">70</span>%</div>
      <button class="round" data-d="5">+</button>
    </div>
    <div class="qp" id="qp"></div>
    <div class="result">
      <div class="kg" id="kgVal">—</div>
      <div class="mut" id="kgExact"></div>
    </div>
    <div class="bar" id="barViz"></div>
    <div class="platelist mut" id="plateTxt"></div>
    <button class="btn" id="btnLogFromCalc">Apuntar lo que he hecho</button>
  </div>
  <div class="card" id="pctTableCard">
    <h2>Tabla de porcentajes</h2>
    <table id="pctTable"></table>
  </div>
</section>

<!-- MARCAS -->
<section id="v-rm" class="hide">
  <div class="card">
    <h2>Mis RM (1 repetición)</h2>
    <div id="rmList"></div>
  </div>
  <div class="card">
    <h2>Añadir ejercicio</h2>
    <div class="row">
      <input id="newLiftName" placeholder="Ej. Sumo deadlift">
      <button class="btn sm" id="btnAddLift">Añadir</button>
    </div>
  </div>
</section>

<!-- HISTORIAL -->
<section id="v-log" class="hide">
  <div class="card">
    <div class="row" style="align-items:center">
      <select id="logFilter"></select>
      <button class="btn sm" id="btnNewLog" style="flex:0 0 auto">+ Nueva</button>
    </div>
    <div id="logList"></div>
  </div>
</section>

<!-- AJUSTES -->
<section id="v-set" class="hide">
  <div class="card">
    <h2>Barra y discos</h2>
    <label>Peso de la barra</label>
    <div class="seg" id="segBar">
      <button data-v="20">20 kg</button><button data-v="15">15 kg</button><button data-v="10">10 kg</button><button data-v="0">Sin barra</button>
    </div>
    <label>Redondear a múltiplos de</label>
    <div class="seg" id="segStep">
      <button data-v="0.5">0,5</button><button data-v="1">1</button><button data-v="2.5">2,5</button><button data-v="5">5</button>
    </div>
    <label>Forma de redondear</label>
    <div class="seg" id="segMode">
      <button data-v="near">Al más cercano</button><button data-v="down">Hacia abajo</button>
    </div>
    <label>Discos disponibles por lado (kg, separados por espacios)</label>
    <input id="platesInp" inputmode="decimal">
  </div>
  <div class="card">
    <h2>Copia de seguridad</h2>
    <button class="btn sec" id="btnExport">Exportar datos (JSON)</button>
    <button class="btn sec" id="btnImport">Importar datos</button>
    <input type="file" id="fileImp" accept="application/json" class="hide">
    <p class="mut">Los datos se guardan solo en este dispositivo (localStorage, clave <code>cargas.v1</code>).</p>
  </div>
</section>
</main>

<nav>
  <button data-v="calc" class="on"><i>%</i>Calcular</button>
  <button data-v="rm"><i>🏋️</i>Marcas</button>
  <button data-v="log"><i>📒</i>Historial</button>
  <button data-v="set"><i>⚙️</i>Ajustes</button>
</nav>

<dialog id="dlgLog">
  <h2 id="dlgTitle">Apuntar serie</h2>
  <label>Ejercicio</label>
  <select id="fLift"></select>
  <div class="row">
    <div><label>Fecha</label><input type="date" id="fDate"></div>
    <div><label>% del RM</label><input type="number" id="fPct" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label>Peso (kg)</label><input type="number" id="fW" inputmode="decimal" step="0.5"></div>
    <div><label>Series</label><input type="number" id="fSets" inputmode="numeric" value="1"></div>
    <div><label>Reps</label><input type="number" id="fReps" inputmode="numeric" value="1"></div>
  </div>
  <label>Notas</label>
  <input id="fNote" placeholder="Ej. EMOM 10', iba sobrado">
  <div class="mut" id="fEst" style="margin-top:8px"></div>
  <button class="btn" id="fSave">Guardar</button>
  <button class="btn sec" id="fCancel">Cancelar</button>
</dialog>

<div class="toast" id="toast"></div>

<script>
const KEY='cargas.v1';
const DEFAULT_LIFTS=['Back squat','Front squat','Overhead squat','Deadlift','Clean','Power clean','Squat clean','Clean & jerk','Snatch','Power snatch','Strict press','Push press','Push jerk','Split jerk','Thruster','Bench press'];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const today=()=>new Date().toISOString().slice(0,10);

let S=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.lifts)return d;}catch(e){}
  return{
    settings:{bar:20,step:2.5,mode:'near',plates:[25,20,15,10,5,2.5,1.25]},
    lifts:DEFAULT_LIFTS.map(n=>({id:uid(),name:n,rm:null,history:[]})),
    log:[],ui:{lift:null,pct:70}
  };
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar');}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('es-ES',{maximumFractionDigits:2});
const lift=id=>S.lifts.find(l=>l.id===id);
const epley=(w,r)=>r<=1?w:w*(1+r/30);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}

function roundW(w){
  const st=S.settings.step||2.5;
  const f=S.settings.mode==='down'?Math.floor:Math.round;
  return Math.max(0,f(w/st+1e-9)*st);
}
function platesFor(total){
  const bar=S.settings.bar;
  if(total<bar)return null;
  let side=(total-bar)/2;const out=[];
  const pl=[...S.settings.plates].sort((a,b)=>b-a);
  for(const p of pl){while(side>=p-1e-9){out.push(p);side-=p;}}
  return{out,rest:Math.round(side*2*100)/100};
}
const PCOL={25:'#d33',20:'#2d6be3',15:'#e0b400',10:'#2a9d5b',5:'#ddd',2.5:'#d33',1.25:'#777',2:'#2d6be3',1.5:'#e0b400',1:'#2a9d5b',0.5:'#ddd'};

/* ---------- NAV ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function show(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['calc','rm','log','set'].forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));
  ({calc:renderCalc,rm:renderRM,log:renderLog,set:renderSet})[v]();
  scrollTo(0,0);
}

/* ---------- CALC ---------- */
function renderCalc(){
  if(!S.ui.lift||!lift(S.ui.lift)){const f=S.lifts.find(l=>l.rm)||S.lifts[0];S.ui.lift=f&&f.id;}
  $('#calcLifts').innerHTML=[...S.lifts].sort((a,b)=>(!!b.rm)-(!!a.rm)).map(l=>
    `<button class="chip ${l.id===S.ui.lift?'on':''} ${l.rm?'':'dim'}" data-id="${l.id}">${esc(l.name)}${l.rm?' · '+fmt(l.rm):''}</button>`).join('');
  $('#calcLifts').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.ui.lift=c.dataset.id;save();renderCalc();});
  $('#qp').innerHTML=[50,60,65,70,75,80,85,90,95,100,105,110].map(p=>`<button data-p="${p}" class="${p===S.ui.pct?'on':''}">${p}</button>`).join('');
  $('#qp').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.ui.pct=+b.dataset.p;save();renderCalc();});
  updateCalc();
}
document.querySelectorAll('.round').forEach(b=>b.onclick=()=>{
  S.ui.pct=Math.min(150,Math.max(5,S.ui.pct+ +b.dataset.d));save();renderCalc();
});
function updateCalc(){
  const l=lift(S.ui.lift);$('#pctVal').textContent=S.ui.pct;
  $('#hdrLift').textContent=l?l.name:'';
  if(!l||!l.rm){
    $('#kgVal').innerHTML='—';$('#kgExact').innerHTML=l?'Sin RM para '+esc(l.name)+'. <a href="#" id="goRm" style="color:var(--acc)">Añádelo en Marcas</a>':'';
    const g=$('#goRm');if(g)g.onclick=e=>{e.preventDefault();show('rm');};
    $('#barViz').innerHTML='';$('#plateTxt').textContent='';$('#pctTableCard').classList.add('hide');return;
  }
  const exact=l.rm*S.ui.pct/100,w=roundW(exact);
  $('#kgVal').innerHTML=fmt(w)+'<small> kg</small>';
  $('#kgExact').textContent=`exacto ${fmt(exact)} kg · RM ${fmt(l.rm)} kg`;
  drawBar(w);
  $('#pctTableCard').classList.remove('hide');
  let h='<tr><th>%</th><th class="r">Exacto</th><th class="r">Carga</th></tr>';
  for(let p=40;p<=100;p+=5){const e=l.rm*p/100;h+=`<tr class="${p===S.ui.pct?'hl':''}"><td>${p}%</td><td class="r mut">${fmt(e)}</td><td class="r"><b>${fmt(roundW(e))}</b></td></tr>`;}
  $('#pctTable').innerHTML=h;
}
function drawBar(w){
  const r=platesFor(w);
  if(!r){$('#barViz').innerHTML='';$('#plateTxt').textContent=S.settings.bar?'Menos que la barra sola':'';return;}
  const pl=r.out;
  const html=pl.map(p=>{const h=Math.max(28,Math.min(84,30+p*2.2)),wd=p>=10?14:10;
    return `<div class="plate" style="height:${h}px;width:${wd}px;background:${PCOL[p]||'#888'};color:${p===5||p===0.5?'#222':'#fff'}">${fmt(p)}</div>`;}).join('');
  $('#barViz').innerHTML=S.settings.bar?`<div class="sleeve"></div>${html}`:html;
  $('#plateTxt').innerHTML=S.settings.bar
    ?(pl.length?`Por lado: <b style="color:var(--txt)">${pl.map(fmt).join(' + ')}</b> (barra ${S.settings.bar} kg)`:'Solo la barra')
     +(r.rest?` · faltan ${fmt(r.rest)} kg con tus discos`:'')
    :'';
}
$('#btnLogFromCalc').onclick=()=>{
  const l=lift(S.ui.lift);
  openLog({liftId:S.ui.lift,pct:S.ui.pct,weight:l&&l.rm?roundW(l.rm*S.ui.pct/100):''});
};

/* ---------- RM ---------- */
function renderRM(){
  $('#rmList').innerHTML=S.lifts.map(l=>{
    const last=l.history.length?l.history[l.history.length-1]:null;
    return `<div class="lift"><div class="n"><b>${esc(l.name)}</b><span class="mut">${last?'Actualizado '+new Date(last.date).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'2-digit'})+(l.history.length>1?' · antes '+fmt(l.history[l.history.length-2].rm)+' kg':''):'Sin marca'}</span></div>
    <input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${l.rm??''}" data-id="${l.id}">
    <button class="x" data-del="${l.id}" aria-label="Borrar">×</button></div>`;}).join('');
  $('#rmList').querySelectorAll('input').forEach(i=>i.onchange=()=>{
    const v=parseFloat(i.value.replace(',','.'));setRM(i.dataset.id,isNaN(v)||v<=0?null:v);renderRM();
  });
  $('#rmList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const l=lift(b.dataset.del);if(!confirm(`¿Borrar ${l.name}? Su historial se mantiene.`))return;
    S.lifts=S.lifts.filter(x=>x.id!==l.id);save();renderRM();
  });
}
function setRM(id,v){
  const l=lift(id);if(!l)return;l.rm=v;
  if(v)l.history.push({date:new Date().toISOString(),rm:v});
  save();toast(v?`RM ${l.name}: ${fmt(v)} kg`:'RM borrado');
}
$('#btnAddLift').onclick=()=>{
  const n=$('#newLiftName').value.trim();if(!n)return;
  if(S.lifts.some(l=>l.name.toLowerCase()===n.toLowerCase()))return toast('Ya existe');
  S.lifts.push({id:uid(),name:n,rm:null,history:[]});$('#newLiftName').value='';save();renderRM();
};

/* ---------- LOG ---------- */
function liftOptions(sel,all){
  return (all?'<option value="">Todos los ejercicios</option>':'')+S.lifts.map(l=>`<option value="${l.id}" ${l.id===sel?'selected':''}>${esc(l.name)}</option>`).join('');
}
function renderLog(){
  const f=$('#logFilter');const cur=f.value;f.innerHTML=liftOptions(cur,true);f.value=cur;
  const items=S.log.filter(e=>!cur||e.liftId===cur).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  if(!items.length){$('#logList').innerHTML='<div class="empty">Aún no has apuntado nada.<br>Desde «Calcular» pulsa «Apuntar lo que he hecho».</div>';return;}
  let h='',day='';
  for(const e of items){
    if(e.date!==day){day=e.date;h+=`<div class="day">${new Date(day+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div>`;}
    const l=lift(e.liftId),name=l?l.name:(e.liftName||'¿?');
    const est=epley(e.weight,e.reps);
    const better=l&&e.reps<=10&&(!l.rm||est>l.rm+0.01);
    h+=`<div class="log"><div class="t"><div><b>${esc(name)}</b> <span class="mut">${e.pct?e.pct+'%':''}</span><br>
      <span>${e.sets>1?e.sets+' × ':''}${e.reps} @ <b>${fmt(e.weight)} kg</b></span>${e.reps>1?` <span class="mut">· 1RM est. ${fmt(est)}</span>`:''}
      ${e.note?`<div class="mut">${esc(e.note)}</div>`:''}
      ${better?`<button class="badge" data-pr="${e.id}">¿Nuevo RM? ${fmt(roundW(est))} kg → actualizar</button>`:''}</div>
      <div><button class="x" data-edit="${e.id}">✎</button><button class="x" data-del="${e.id}">×</button></div></div></div>`;
  }
  $('#logList').innerHTML=h;
  $('#logList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Borrar este registro?')){S.log=S.log.filter(x=>x.id!==b.dataset.del);save();renderLog();}});
  $('#logList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openLog(S.log.find(x=>x.id===b.dataset.edit)));
  $('#logList').querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{
    const e=S.log.find(x=>x.id===b.dataset.pr);const est=e.reps<=1?e.weight:roundW(epley(e.weight,e.reps));
    if(confirm(`¿Poner ${fmt(est)} kg como RM de ${lift(e.liftId).name}?`)){setRM(e.liftId,est);renderLog();}
  });
}
$('#logFilter').onchange=renderLog;
$('#btnNewLog').onclick=()=>openLog({liftId:$('#logFilter').value||S.ui.lift});

let editing=null;
function openLog(e){
  editing=e&&e.id?e.id:null;
  $('#dlgTitle').textContent=editing?'Editar registro':'Apuntar serie';
  $('#fLift').innerHTML=liftOptions(e.liftId);
  $('#fDate').value=e.date||today();
  $('#fPct').value=e.pct??'';$('#fW').value=e.weight??'';
  $('#fSets').value=e.sets||1;$('#fReps').value=e.reps||1;$('#fNote').value=e.note||'';
  updEst();$('#dlgLog').showModal();
}
function updEst(){
  const w=parseFloat($('#fW').value),r=parseInt($('#fReps').value)||1,l=lift($('#fLift').value);
  $('#fEst').textContent=w&&r>1?`1RM estimado (Epley): ${fmt(epley(w,r))} kg`+(l&&l.rm?` · tu RM: ${fmt(l.rm)} kg`:''):'';
}
$('#fW').oninput=()=>{const l=lift($('#fLift').value),w=parseFloat($('#fW').value);if(l&&l.rm&&w)$('#fPct').value=Math.round(w/l.rm*100);updEst();};
$('#fPct').oninput=()=>{const l=lift($('#fLift').value),p=parseFloat($('#fPct').value);if(l&&l.rm&&p)$('#fW').value=roundW(l.rm*p/100);updEst();};
$('#fReps').oninput=updEst;$('#fLift').onchange=updEst;
$('#fCancel').onclick=()=>$('#dlgLog').close();
$('#fSave').onclick=()=>{
  const w=parseFloat($('#fW').value);if(!w)return toast('Pon el peso');
  const l=lift($('#fLift').value);if(!l)return toast('Elige ejercicio');
  const rec={id:editing||uid(),ts:Date.now(),date:$('#fDate').value||today(),liftId:l.id,liftName:l.name,
    pct:parseFloat($('#fPct').value)||null,weight:w,sets:parseInt($('#fSets').value)||1,reps:parseInt($('#fReps').value)||1,note:$('#fNote').value.trim()};
  if(editing){const i=S.log.findIndex(x=>x.id===editing);rec.ts=S.log[i].ts;S.log[i]=rec;}else S.log.push(rec);
  save();$('#dlgLog').close();toast('Guardado');
  if(!$('#v-log').classList.contains('hide'))renderLog();
};

/* ---------- AJUSTES ---------- */
function seg(id,key,num){
  const el=$(id);el.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on',String(S.settings[key])===b.dataset.v);
    b.onclick=()=>{S.settings[key]=num?+b.dataset.v:b.dataset.v;save();renderSet();};
  });
}
function renderSet(){
  seg('#segBar','bar',true);seg('#segStep','step',true);seg('#segMode','mode',false);
  $('#platesInp').value=S.settings.plates.map(p=>String(p).replace('.',',')).join('  ');
}
$('#platesInp').onchange=()=>{
  const p=$('#platesInp').value.split(/[;\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0);
  if(p.length){S.settings.plates=[...new Set(p)].sort((a,b)=>b-a);save();toast('Discos guardados');}
  renderSet();
};
$('#btnExport').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download=`cargas-${today()}.json`;a.click();
};
$('#btnImport').onclick=()=>$('#fileImp').click();
$('#fileImp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.lifts||!d.log)throw 0;
    if(confirm('Esto sustituye todos tus datos actuales. ¿Seguir?')){S=d;save();toast('Datos importados');renderSet();}}
  catch(_){toast('Archivo no válido');}
  e.target.value='';
};

renderCalc();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
